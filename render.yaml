services:
  - type: web
    name: sistema-agendamento
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: agendamento-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: agendamento-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: agendamento-db
          property: password
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m"

databases:
  - name: agendamento-db
    databaseName: agendamento
    user: agendamento_user
    plan: free
    region: oregon
